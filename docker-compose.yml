services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: acm
      POSTGRES_PASSWORD: acm
      POSTGRES_DB: acm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acm -d acm"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      # inside the compose network the DB host is `db`, not localhost
      DATABASE_URL: postgresql+asyncpg://acm:acm@db:5432/acm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # live reload: edit code on the host, uvicorn restarts in the container
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    command: >
      sh -c "alembic upgrade head &&
             uvicorn acm.main:create_app --factory --host 0.0.0.0 --port 8000
             --reload --reload-dir /app/src --proxy-headers --forwarded-allow-ips='*'"

volumes:
  pgdata: