{% extends "base.html" %}
{% block title %}Log in · ACM{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="card">
    <h1>Welcome back</h1>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label class="field">
        <span>Email</span>
        <input class="input" name="email" type="email" value="{{ email }}" required autocomplete="email" autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input class="input" name="password" type="password" required autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-footer">No account? <a href="/register">Create one</a></p>
  </div>
</div>
{% endblock %}
