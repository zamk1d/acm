<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ACM{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: dark light;

      --bg: #09090b;
      --surface: #131316;
      --surface-2: #1a1a1f;
      --surface-3: #222228;
      --border: #27272a;
      --border-strong: #3f3f46;

      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;

      --accent: #fe2c55;
      --accent-2: #25f4ee;
      --accent-glow: rgba(254, 44, 85, 0.35);

      --danger: #ef4444;
      --success: #22c55e;

      --radius-lg: 16px;
      --radius: 12px;
      --radius-sm: 8px;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow: 0 4px 12px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.3);

      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f4f4f5;
        --surface-3: #e4e4e7;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --text: #09090b;
        --text-muted: #52525b;
        --text-dim: #71717a;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        --shadow: 0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.55;
      font-size: 16px;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
      opacity: 0.22;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
    }

    h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; }
    h1 { font-size: clamp(1.75rem, 3vw, 2.25rem); }
    h2 { font-size: clamp(1.2rem, 2vw, 1.4rem); }
    h3 { font-size: 1rem; font-weight: 600; }
    p { margin: 0 0 1rem; }
    p:last-child { margin-bottom: 0; }
    a { color: inherit; }

    small { font-size: .8rem; color: var(--text-dim); }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .85em; }

    /* ── Nav ────────────────────────────────────── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      background: color-mix(in oklab, var(--bg) 70%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: .75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--text);
    }
    .brand::before {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .nav-links { display: flex; align-items: center; gap: .75rem; font-size: .9rem; }
    .nav-email {
      color: var(--text-muted);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Layout ─────────────────────────────────── */
    .container { max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .page-head h1 { margin-bottom: .25rem; }
    .page-head p { margin: 0; color: var(--text-muted); font-size: .95rem; }

    /* ── Buttons ────────────────────────────────── */
    .btn {
      --btn-bg: transparent;
      --btn-fg: var(--text);
      --btn-border: var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .6rem 1.1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-fg);
      font: inherit;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--text-muted); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

    .btn-primary {
      --btn-bg: var(--accent);
      --btn-fg: #fff;
      --btn-border: var(--accent);
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover { --btn-bg: #ff4d6f; --btn-border: #ff4d6f; border-color: #ff4d6f; }

    .btn-ghost { --btn-border: transparent; --btn-bg: transparent; color: var(--text-muted); }
    .btn-ghost:hover { color: var(--text); border-color: transparent; }

    .btn-danger { --btn-border: color-mix(in oklab, var(--danger) 55%, transparent); color: var(--danger); }
    .btn-danger:hover { --btn-bg: color-mix(in oklab, var(--danger) 12%, transparent); border-color: var(--danger); }

    .btn-sm { padding: .4rem .75rem; font-size: .8rem; }
    .btn-block { width: 100%; }

    /* ── Form fields ────────────────────────────── */
    .field { display: block; margin-bottom: 1rem; }
    .field > span {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: .35rem;
      letter-spacing: .01em;
    }
    .input, .textarea, input[type="file"] {
      width: 100%;
      padding: .65rem .85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font: inherit;
      font-size: .95rem;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .input:hover, .textarea:hover, input[type="file"]:hover { border-color: var(--border-strong); }
    .input:focus, .textarea:focus, input[type="file"]:focus {
      outline: none;
      border-color: var(--accent-2);
      background: var(--surface);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent-2) 25%, transparent);
    }
    .textarea { resize: vertical; min-height: 5rem; font-family: inherit; }
    input[type="file"] { padding: .5rem; cursor: pointer; }
    input[type="file"]::file-selector-button {
      padding: .4rem .8rem;
      margin-right: .75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-3);
      color: var(--text);
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
      transition: background .15s;
    }
    input[type="file"]::file-selector-button:hover { background: var(--border); }

    /* ── Badges ─────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .2rem .55rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 500;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }

    /* ── Alert ──────────────────────────────────── */
    .alert {
      padding: .75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: .9rem;
      margin-bottom: 1rem;
      border: 1px solid;
    }
    .alert-error {
      background: color-mix(in oklab, var(--danger) 10%, transparent);
      border-color: color-mix(in oklab, var(--danger) 40%, transparent);
      color: color-mix(in oklab, var(--danger) 90%, var(--text));
    }

    /* ── DL ─────────────────────────────────────── */
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1.25rem; margin: 1rem 0 0; font-size: .9rem; }
    dt { color: var(--text-dim); font-weight: 500; }
    dd { margin: 0; color: var(--text-muted); word-break: break-word; }

    /* ── Avatar ─────────────────────────────────── */
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-3);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      flex-shrink: 0;
    }

    /* ── Grid ───────────────────────────────────── */
    .grid { display: grid; gap: 1rem; }
    .grid-accounts { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .grid-videos { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

    /* ── Video card ─────────────────────────────── */
    .video-card {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .5rem;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      overflow: hidden;
    }
    .video-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow);
    }
    .video-thumb {
      width: 100%;
      aspect-ratio: 9/16;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--surface-3);
      display: block;
      transition: transform .3s ease;
    }
    .video-card:hover .video-thumb { transform: scale(1.02); }
    .video-thumb-empty {
      width: 100%;
      aspect-ratio: 9/16;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: .75rem;
      border: 1px dashed var(--border);
    }
    .video-title {
      font-size: .85rem;
      font-weight: 500;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      padding: 0 .25rem .25rem;
    }

    /* ── Empty ──────────────────────────────────── */
    .empty { padding: 2.5rem 1rem; text-align: center; color: var(--text-dim); font-size: .9rem; }
    .empty h3 { color: var(--text-muted); margin-bottom: .35rem; font-size: 1rem; }
    .empty p { margin-bottom: 1.25rem; }

    /* ── Account header ─────────────────────────── */
    .account-head { display: flex; align-items: center; gap: 1rem; margin-bottom: .5rem; }
    .account-head h2 { margin: 0; font-size: 1.15rem; }
    .account-head .sub { color: var(--text-dim); font-size: .78rem; margin-top: .15rem; }

    .divider { height: 1px; background: var(--border); margin: 1.25rem 0; border: none; }

    /* ── Hero (landing) ─────────────────────────── */
    .hero { text-align: center; padding: 3rem 1rem 4rem; }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
      background: linear-gradient(180deg, var(--text) 40%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .hero h1 .accent {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 520px;
      margin: 0 auto 2rem;
    }
    .hero .row { justify-content: center; }

    /* ── Auth ───────────────────────────────────── */
    .auth-card { max-width: 400px; margin: 3rem auto 0; }
    .auth-card h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
    .auth-footer {
      text-align: center;
      font-size: .85rem;
      color: var(--text-dim);
      margin-top: 1rem;
    }
    .auth-footer a { color: var(--accent-2); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    /* ── Error page ─────────────────────────────── */
    .error-page { text-align: center; padding: 4rem 1rem; }
    .error-code {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: .5rem;
      letter-spacing: -0.05em;
    }

    /* ── Utils ──────────────────────────────────── */
    .muted { color: var(--text-muted); }
    .dim { color: var(--text-dim); }
    .text-sm { font-size: .85rem; }
    .mt-1 { margin-top: .5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }

    @media (max-width: 600px) {
      .nav-email { display: none; }
      .container { padding: 1.5rem 1rem 3rem; }
      .page-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="{% if user %}/dashboard{% else %}/{% endif %}">ACM</a>
      {% if user %}
      <nav class="nav-links">
        <a href="/dashboard" class="btn btn-ghost btn-sm">Dashboard</a>
        <span class="nav-email">{{ user.email }}</span>
        <form method="post" action="/logout" style="margin:0">
          <button class="btn btn-sm" type="submit">Log out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
